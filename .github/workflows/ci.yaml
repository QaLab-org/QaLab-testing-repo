    name: 📦 Build project
    runs-on: ubuntu-latest
    steps:
      - name: Build-app
        run: |
              echo "🔧 Build is success..."
              
      - name: run-app
        run: |
              echo " different log"
             
  lint:
    name: 🕵️ Lint
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Check lint issues
        run: |
              echo "No Lint issues found"  
             
  
  unit-test:
    name: 🕵️ Unit tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Run unit tests
        run: |
              pwd
              ls
              echo "Unit tests are success..."
             
  
  deploy-app:
    name: 🚀 Deploy-app
